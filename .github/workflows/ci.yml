# Checks formatting, analyses and tests payments_lk on Flutter's stable
# channel, and dry runs the publish so pub.dev's own checks never surprise a
# release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Publish dry run
        run: flutter pub publish --dry-run
